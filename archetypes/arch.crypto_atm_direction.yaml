typical_descriptions:
- they told me to put cash into a bitcoin machine at the gas station
- I was told to deposit money into a "safety locker"
- they called it a federal safety account and said to use the crypto ATM
- the bank/IRS/utility said to pay through a bitcoin kiosk
narrative: 'This archetype can be attached to almost any scam narrative — a

  fake bank, government agency, or utility — because the tell is not who is

  calling but WHAT they are asking the protected user to physically do:

  deposit cash into a cryptocurrency ATM or kiosk, sometimes dressed up with

  a reassuring name like "safety locker" or "federal safety account." No

  legitimate institution of any kind directs payment through a crypto ATM.

  The physical act of standing at a machine and feeding in cash is itself

  the decisive tell, independent of the cover story used to get there.'
response_template: 'No real bank, government office, or utility company ever

  asks you to pay by putting cash into a bitcoin or crypto machine — that

  is always a scam, no matter who they say they are.


  Please don''t go to that machine or put in any money. If you already

  did, that money can''t be gotten back, so let''s talk about what to do

  next and who to report it to.


  If anyone ever tells you to use a "safety locker" or a bitcoin machine

  to protect your money, that''s the moment to stop and call me.'
