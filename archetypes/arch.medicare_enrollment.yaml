typical_descriptions:
- someone called saying they needed to verify my Medicare number
- they said I needed to pay for a new Medicare card
- a broker kept pressuring me to switch my Medicare plan
- they said my Medicare benefits would end if I didn't act today
narrative: 'Medicare never calls unsolicited to verify a beneficiary''s

  Medicare number, and it never charges for a new or replacement card —

  cards are free and mailed automatically. During open enrollment

  (October 15 - December 7), this family also includes aggressive brokers

  pushing junk or unsuitable plans under time pressure. The deterministic

  rule is simple: an unsolicited call claiming to be Medicare is a scam.

  The protected move is always the same — hang up, and if there''s any

  real question about Medicare, call 1-800-MEDICARE directly.'
response_template: 'Medicare never calls you out of the blue to verify your

  number, and a real Medicare card is always free — there''s never a fee.


  Please don''t confirm your Medicare number or pay anything on that call.

  If you want to check on anything Medicare-related, call 1-800-MEDICARE

  yourself, not any number they gave you.


  It''s Medicare season right now, so calls like this are common — if

  anyone calls about your Medicare number again, it''s a scam.'
