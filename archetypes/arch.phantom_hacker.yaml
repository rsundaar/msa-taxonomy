typical_descriptions:
- a pop-up said my computer was infected and gave me a number to call
- Microsoft support asked to look at my computer
- then someone from my bank's fraud department called about the same problem
- they said my money wasn't safe and I needed to move it to protect it
- then someone from the Federal Reserve called to confirm it
narrative: 'Phantom hacker is three impersonations chained together, each one

  making the last one seem more credible. It starts with a fake tech-support

  contact — a pop-up or a call claiming the computer is infected — that asks

  for remote access. Next, a "bank fraud department" calls, often naming the

  first caller by way of confirmation, and says the protected user''s

  accounts have been compromised and their money needs to be moved to a

  "safe" account to protect it. No real bank, brokerage, or government

  agency EVER tells someone to move their own money to protect it — that

  instruction is itself the fraud. A third call, sometimes claiming to be a

  government agency (the Federal Reserve or similar), may follow to make an

  "alias account" or wire feel official.


  The chain itself is the fingerprint: a legitimate institution does not

  hand a customer between several separate callers "confirming" the same

  story. Always ask whether anyone else has called about the same problem.'
response_template: 'This matches a scam called the "phantom hacker" that has

  cost people over a billion dollars. It usually starts with a fake computer

  problem, then a second call pretending to be your bank''s fraud

  department, and sometimes a third call pretending to be a government

  agency — each one making the last seem more real.


  No real bank or government agency ever tells you to move your money to

  protect it. Please don''t move any money, and don''t give anyone remote

  access to your computer. If you already did, let''s call your bank

  directly on the number on your card right now, not any number you were

  given.


  They''ll likely call again, maybe claiming to be your bank or even the

  police. Don''t answer — call the number on your card instead.'
