  note: Added the move_money_claim value. Additive; existing values unchanged. It lets pressure_tone
    carry the phantom-hacker "move your money to protect it" narrative, and corresponds to
    sig.narrative.move_money_to_protect_it.
attribute_id: pressure_tone
order: 4
severity: high
role: decisive_positive
values:
- urgency
- threat
- secrecy
- too_good_to_be_true
- affection
- move_money_claim
- none
- unknown
multi: true
describe: the emotional pressure in the contact; threat and secrecy are the strong ones (may
  be more than one). move_money_claim = told to move money to a "safer" account
  to protect it from fraud.
probe: How did it make you feel — were they rushing you, threatening you, or telling you to
  keep it quiet?
