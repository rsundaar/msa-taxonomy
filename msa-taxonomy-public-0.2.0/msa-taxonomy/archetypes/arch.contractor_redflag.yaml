typical_descriptions:
- a contractor knocked and said they noticed my roof needs work
- they said they were already working in the neighborhood
- they want full payment in cash before starting, today only
- they told me to pull the building permit myself
narrative: 'A contractor who was not called shows up claiming to have

  noticed a problem — often the roof, driveway, or gutters — and offers a

  today-only price. The unsolicited claim of a problem is the same

  structural tell as any other doorstep or phone scam. Red flags stack:

  demanding full payment or a large deposit upfront, cash only, pressure

  to decide today, and telling the homeowner to pull their own building

  permit (a sign the contractor may be unlicensed). The protective moves

  are always the same: get at least three estimates, look up the

  contractor''s license, and never pay the full amount upfront.'
response_template: 'A few things about this contractor are worth pausing

  on: legitimate contractors don''t usually go door to door claiming to

  have spotted a problem, and asking for full or large payment upfront in

  cash, with a price that''s only good today, is a very common scam

  pattern.


  Please don''t pay anything or sign anything today. It''s worth getting

  two or three other estimates and checking whether they''re a licensed

  contractor before agreeing to any work.'
