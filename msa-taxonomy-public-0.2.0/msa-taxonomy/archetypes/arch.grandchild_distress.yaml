typical_descriptions:
- my grandson called and said he was in jail
- I got a call that one of my kids was in an accident
- someone said my grandchild needs bail money
- he sounded like Jamie but something felt off about it
narrative: 'Scammers can now clone a grandchild''s voice from a few seconds of

  social-media audio. The hallmarks of this scam are urgency (the

  grandchild is in jail / in hospital / in an accident *right now*),

  gift-card payment ("they only accept gift cards at the courthouse"),

  and secrecy ("please don''t tell mom — she''ll worry"). The protected

  user often describes a feeling that the voice was "off" — slower,

  less expressive, missing inside expressions — even before learning

  to suspect AI cloning.


  The right response is always: hang up and verify by calling the

  grandchild on a number the protected user already has saved,

  independently. If the grandchild does not answer, call another

  family member. The protected user must not send money, send gift

  cards, or follow further instructions from the original caller.'
response_template: 'That sounds like a very common scam right now, and a serious one.

  Scammers can copy someone''s voice from just a few seconds of

  social media, so it can sound just like {grandchild_name} even

  when it isn''t really them.


  Before you do anything, please call {grandchild_name} directly —

  on the phone number you already have saved, not any number that

  caller gave you. If they don''t answer, call {grandchild_other_family}.


  Do not send any money, do not buy any gift cards, and do not

  follow any more instructions from the person who called you.


  I''ll wait here with you while you make the call.'
forward_recommended_when: []
