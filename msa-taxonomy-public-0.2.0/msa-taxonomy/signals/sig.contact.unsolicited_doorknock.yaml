name: Unsolicited contractor knocks claiming to have noticed needed work
detection_mode:
- verbal
severity: medium
grounding: theory
mechanisms:
- mech.scarcity_urgency
short_rationale: A stranger who was not called shows up claiming to be "working in the neighborhood"
  or to have "noticed your roof," and offers to fix a problem the homeowner never reported.
  The unsolicited claim of a problem is the same structural tell as any other doorstep or
  phone scam.
natural_probes:
- Did you call anyone, or did they just show up and say they noticed something wrong?
- Did they say they were already working nearby?
