name: Instructed to deposit cash into a crypto ATM or kiosk
detection_mode:
- verbal
severity: critical
grounding: theory
mechanisms:
- mech.authority
- mech.scarcity_urgency
short_rationale: No bank, government agency, or utility ever directs payment through a bitcoin
  ATM or kiosk. Any narrative (a "safety locker," a "federal safety account," a fraud-protection
  deposit) that ends in cash going into a crypto machine is physical-world proof of a scam.
natural_probes:
- Did anyone tell you to put cash into a bitcoin or crypto machine, like one at a gas station
  or convenience store?
- Did they call it something like a "safety locker" or a "federal safety account"?
