name: Payment demanded in cryptocurrency or bitcoin
detection_mode:
- verbal
- artifact
severity: critical
grounding: theory
mechanisms:
- mech.dishonesty_appeal
short_rationale: Demands for bitcoin or other cryptocurrency are a hallmark of scams because
  the payment is fast, irreversible, and very hard to trace or recover.
natural_probes:
- Did they ask you to pay with bitcoin or any kind of cryptocurrency?
- Did they tell you to use a Bitcoin machine, a crypto app, or a special online wallet?
- Was the payment they wanted something other than your normal bank or card?
