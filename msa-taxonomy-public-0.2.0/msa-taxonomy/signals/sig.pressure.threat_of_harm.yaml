name: Threat to harm a person unless you pay
detection_mode:
- verbal
- artifact
severity: critical
grounding: ungrounded_pending_review
mechanisms: []
short_rationale: No legitimate person or institution threatens to hurt a loved one to force
  a payment. A threat of harm is coercion, the signature of an extortion or virtual-kidnapping
  scam.
natural_probes:
- Did they threaten to hurt someone, or say something bad would happen to a person if you
  didn't pay?
- Have you actually spoken with your grandson yourself, or only with the person who called
  you?
- Did you hear your grandson on the call, or just the caller telling you he was in trouble?
notes: 'Coercion by fear does not map cleanly onto the Cialdini or

  Stajano-Wilson persuasion taxonomies, which model influence rather

  than threat, so grounding is ungrounded_pending_review pending

  fraud-researcher review (see references "Notable gaps"; MSA paper

  §9 discusses options, including a distinct Coercion mechanism

  family). The second

  and third probes are the decisive ones for virtual-kidnapping:

  victims rarely verify the loved one is actually in danger. Confirming

  they have NOT reached the person independently is what defuses it.'
