  note: corroborating source on the wrong-number/dating-app opener pattern
name: Unsolicited "wrong number" or dating-app opener from a stranger
detection_mode:
- verbal
severity: medium
grounding: theory
mechanisms:
- mech.liking
short_rationale: Pig-butchering relationships are seeded by a stranger who "accidentally"
  texts the wrong number, matches on a dating app, or sends a friendly DM, then keeps the
  conversation going. The opener itself is innocent-compatible; it is the tell only in combination
  with what follows.
natural_probes:
- How did you first start talking to this person — did they text you by "mistake," match with
  you on an app, or message you out of the blue?
- Was this someone you had never talked to before they reached out?
