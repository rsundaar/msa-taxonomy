  note: Pig-butchering, the top loss family. The "wrong number" text or DM opener is used
    to start a relationship before the investment ask.
- source: staysafeonline_pig_butchering_2026
  ref: https://www.staysafeonline.org/articles/what-is-pig-butchering-and-how-to-spot-the-scam
