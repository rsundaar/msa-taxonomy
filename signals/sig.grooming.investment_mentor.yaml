short_rationale: A relatively new contact casually shows off trading success and offers to
  teach the senior how to invest, building both affection and the hope of easy profit before
  any money changes hands.
natural_probes:
- Has this person talked about how much money they've made investing or trading?
- Have they offered to teach you or help you get started investing?
