id: sig.impersonation.voice_clone
kind: signal
version_added: 0.1.0
version_deprecated: null
preview: false
provenance:
- source: sahai-seed
  ref: code/data/triage_patterns.yaml
  retrieved_at: '2026-07-09T00:00:00Z'
  note: migrated from the MSA pattern library (seed v0)
name: Voice sounded almost-but-not-quite right
detection_mode:
- verbal
severity: high
grounding: theory
mechanisms:
- mech.authority
- mech.liking
short_rationale: 'AI voice clones are often subtly wrong: slower pacing, less natural prosody,
  missing inside jokes or speech tics.'
natural_probes:
- Did the voice sound a little different than usual — maybe slower, or oddly flat?
- Did anything about how they spoke feel off to you?
- Did they use phrases or expressions that didn't sound quite like them?
notes: 'Emerging signal as of 2024. Older adults may not yet know to suspect

  voice cloning. If user has not raised the possibility, ask about

  voice quality but do not lead with the suggestion that it might be

  AI — let the senior describe what they noticed first.'
