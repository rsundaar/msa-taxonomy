name: Told to move money "to protect it" from fraud
detection_mode:
- verbal
severity: critical
grounding: theory
mechanisms:
- mech.authority
- mech.scarcity_urgency
short_rationale: No real bank, brokerage, or government agency ever instructs a customer to
  move their own money into a different account to keep it safe from fraud — that instruction
  IS the fraud. This is the phantom-hacker's second-stage narrative, usually delivered by
  a fake "bank fraud department."
natural_probes:
- Did anyone tell you to move your money to a different or "safer" account?
- Who told you your money needed to be moved — did they say they were from your bank, or somewhere
  else?
