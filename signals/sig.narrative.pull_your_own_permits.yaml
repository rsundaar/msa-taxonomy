name: Tells the homeowner to pull the building permits themselves
detection_mode:
- verbal
severity: medium
grounding: theory
mechanisms:
- mech.dishonesty_appeal
short_rationale: A licensed contractor normally pulls their own permits as part of the job.
  Asking the homeowner to do it instead is a common way an unlicensed or uninsured contractor
  avoids being tied to the work or being checked against a license registry.
natural_probes:
- Did they ask you to get the building permit yourself instead of them getting it?
- Have they shown you a contractor's license number?
