name: Payment requested via gift cards
detection_mode:
- verbal
- artifact
severity: critical
grounding: theory
mechanisms:
- mech.dishonesty_appeal
short_rationale: No legitimate entity ever requires gift cards as payment. Period.
natural_probes:
- Did they ask you to send money — in gift cards, wire transfer, or bitcoin?
- Was the payment they wanted anything other than your normal bank or card?
- Did they mention iTunes, Google Play, Amazon, or Steam gift cards specifically?
